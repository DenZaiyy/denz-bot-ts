server {
    listen 80;
    listen [::]:80;

    server_name hostinger.k-grischko.fr www.hostinger.k-grischko.fr;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hostinger.k-grischko.fr$request_uri;
    }
}